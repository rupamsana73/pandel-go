<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#060a10"
    >

    <title>PANDEL GO | Your Puja Guide</title>


    <!-- Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


<style>

/* =========================================================
   PANDEL GO — LANDING PAGE
========================================================= */

:root {

    --bg: #060a10;

    --surface: #0d141e;

    --cyan: #00d9ff;

    --blue: #287cff;

    --green: #00e89a;

    --text: #f7fbff;

    --muted: #8491a2;

    --border: rgba(255,255,255,.075);

}


/* =========================================================
   RESET
========================================================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


html,
body {

    width: 100%;

    min-height: 100%;

}


body {

    min-height: 100vh;

    min-height: 100dvh;

    font-family:
        "Inter",
        sans-serif;

    background:
        var(--bg);

    color: var(--text);

    overflow: hidden;

}


a {

    text-decoration: none;

    color: inherit;

}


/* =========================================================
   BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

}


/* Main glow */

.background::before {

    content: "";

    position: absolute;

    width: 700px;

    height: 700px;

    top: -360px;

    left: 50%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(0,217,255,.13),
            transparent 67%
        );

}


/* Bottom glow */

.background::after {

    content: "";

    position: absolute;

    width: 600px;

    height: 400px;

    bottom: -260px;

    left: 50%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(40,124,255,.11),
            transparent 70%
        );

}


/* =========================================================
   GRID
========================================================= */

.grid {

    position: absolute;

    inset: 0;

    opacity: .17;

    background-image:

        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

}


/* =========================================================
   FLOATING DOTS
========================================================= */

.dot {

    position: absolute;

    width: 4px;

    height: 4px;

    border-radius: 50%;

    background:
        var(--cyan);

    box-shadow:
        0 0 12px
        rgba(0,217,255,.8);

    opacity: .65;

    animation:
        floatDot 7s ease-in-out infinite;

}


.dot:nth-child(2) {

    animation-delay: 1.5s;

}


.dot:nth-child(3) {

    animation-delay: 3s;

}


.dot:nth-child(4) {

    animation-delay: 4.5s;

}


@keyframes floatDot {

    0%,
    100% {

        transform:
            translateY(0);

        opacity: .35;

    }

    50% {

        transform:
            translateY(-35px);

        opacity: .8;

    }

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    position: fixed;

    top: 0;

    left: 0;

    right: 0;

    z-index: 100;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(6,10,16,.72);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

}


/* Logo */

.logo {

    display: flex;

    align-items: center;

    gap: 10px;

}


.logo-icon {

    width: 38px;

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--blue)
        );

    color: #001017;

    font-size: 16px;

    box-shadow:
        0 7px 20px
        rgba(0,217,255,.16);

}


.logo-name {

    font-size: 15px;

    font-weight: 800;

    letter-spacing: .5px;

}


.logo-tagline {

    color: var(--muted);

    font-size: 8px;

    letter-spacing: 1.4px;

    margin-top: 1px;

}


/* Navbar links */

.nav-links {

    display: flex;

    align-items: center;

    gap: 8px;

}


.nav-link {

    padding:
        8px 13px;

    border-radius: 9px;

    color: #8e9aaa;

    font-size: 10px;

    font-weight: 600;

    transition: .2s;

}


.nav-link:hover {

    color: white;

    background:
        rgba(255,255,255,.04);

}


/* =========================================================
   HERO
========================================================= */

.hero {

    min-height: 100vh;

    min-height: 100dvh;

    position: relative;

    z-index: 2;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        95px 20px 40px;

}


/* =========================================================
   HERO CONTENT
========================================================= */

.hero-content {

    width: min(850px, 100%);

    animation:
        heroEnter .8s
        cubic-bezier(.2,.8,.2,1);

}


@keyframes heroEnter {

    from {

        opacity: 0;

        transform:
            translateY(25px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* Badge */

.badge {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding:
        7px 12px;

    border-radius: 30px;

    background:
        rgba(0,217,255,.055);

    border:
        1px solid
        rgba(0,217,255,.13);

    color:
        #86edff;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: .4px;

    margin-bottom: 23px;

}


.badge-dot {

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background:
        var(--green);

    box-shadow:
        0 0 8px
        var(--green);

}


/* Main heading */

.hero h1 {

    font-size:
        clamp(
            42px,
            8vw,
            82px
        );

    line-height: .98;

    letter-spacing:
        -4px;

    font-weight: 800;

    margin-bottom: 22px;

}


.hero h1 span {

    display: block;

    background:

        linear-gradient(
            110deg,
            #ffffff 15%,
            #9defff 45%,
            var(--cyan) 70%,
            #6eabff 100%
        );

    background-clip:
        text;

    -webkit-background-clip:
        text;

    color:
        transparent;

}


/* Description */

.hero-description {

    width: min(570px,100%);

    margin:
        0 auto;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.8;

}


/* =========================================================
   ACTIONS
========================================================= */

.actions {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;

    margin-top: 31px;

}


.action {

    min-width: 130px;

    height: 46px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    border-radius: 11px;

    font-size: 11px;

    font-weight: 700;

    transition:
        transform .2s,
        box-shadow .2s,
        background .2s;

}


.login {

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--blue)
        );

    color: #001017;

    box-shadow:
        0 10px 28px
        rgba(0,217,255,.15);

}


.register {

    background:
        rgba(255,255,255,.025);

    color: var(--text);

    border:
        1px solid
        var(--border);

}


.action:hover {

    transform:
        translateY(-3px);

}


.login:hover {

    box-shadow:
        0 14px 35px
        rgba(0,217,255,.24);

}


.register:hover {

    border-color:
        rgba(0,217,255,.3);

    background:
        rgba(0,217,255,.045);

}


/* =========================================================
   FEATURE ROW
========================================================= */

.features {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    margin-top: 42px;

}


.feature {

    display: flex;

    align-items: center;

    gap: 7px;

    color: #677588;

    font-size: 9px;

}


.feature i {

    color:
        var(--cyan);

    font-size: 10px;

}


/* =========================================================
   SCROLL INDICATOR
========================================================= */

.scroll-indicator {

    position: absolute;

    bottom: 24px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 6px;

    color: #465466;

    font-size: 7px;

    letter-spacing: 1px;

}


.scroll-line {

    width: 1px;

    height: 24px;

    background:
        linear-gradient(
            var(--cyan),
            transparent
        );

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    body {

        overflow: hidden;

    }


    .navbar {

        height: 64px;

        padding:
            0 16px;

    }


    .logo-icon {

        width: 36px;

        height: 36px;

    }


    .logo-name {

        font-size: 14px;

    }


    .logo-tagline {

        font-size: 7px;

    }


    .nav-links {

        display: none;

    }


    .hero {

        padding:
            75px 18px 40px;

    }


    .hero h1 {

        font-size:
            clamp(
                43px,
                14vw,
                65px
            );

        letter-spacing:
            -2.8px;

        margin-bottom: 18px;

    }


    .hero-description {

        font-size: 12px;

        line-height: 1.7;

        max-width: 340px;

    }


    .badge {

        margin-bottom: 19px;

        font-size: 8px;

    }


    .actions {

        margin-top: 25px;

        gap: 8px;

    }


    .action {

        min-width: 125px;

        height: 45px;

    }


    .features {

        gap: 15px;

        margin-top: 32px;

        flex-wrap: wrap;

    }


    .feature {

        font-size: 8px;

    }


    .scroll-indicator {

        display: none;

    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 380px) {

    .hero {

        padding:
            70px 15px 30px;

    }


    .hero h1 {

        font-size: 43px;

    }


    .hero-description {

        font-size: 11px;

    }


    .actions {

        flex-direction: column;

        width: 100%;

    }


    .action {

        width: 100%;

        max-width: 300px;

    }


    .features {

        margin-top: 25px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation:
            none !important;

        transition:
            none !important;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="background">

    <div class="grid"></div>


    <div
        class="dot"
        style="top:20%;left:14%;"
    ></div>


    <div
        class="dot"
        style="top:33%;right:15%;"
    ></div>


    <div
        class="dot"
        style="bottom:25%;left:25%;"
    ></div>


    <div
        class="dot"
        style="bottom:18%;right:28%;"
    ></div>

</div>



<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">


    <a
        href="#"
        class="logo"
    >

        <div class="logo-icon">

            <i class="fa-solid fa-gopuram"></i>

        </div>


        <div>

            <div class="logo-name">
                PANDEL GO
            </div>

            <div class="logo-tagline">
                YOUR PUJA GUIDE
            </div>

        </div>

    </a>



    <nav class="nav-links">

        <a
            href="{% url 'login' %}"
            class="nav-link"
        >
            Login
        </a>


        <a
            href="{% url 'register' %}"
            class="nav-link"
        >
            Register
        </a>

    </nav>

</header>



<!-- =========================================================
     HERO
========================================================= -->

<main class="hero">


    <div class="hero-content">


        <!-- Badge -->

        <div class="badge">

            <span class="badge-dot"></span>

            SMART DURGA PUJA EXPERIENCE

        </div>



        <!-- Heading -->

        <h1>

            <span>
                Discover.
            </span>

            <span>
                Explore.
            </span>

            <span>
                Celebrate.
            </span>

        </h1>



        <!-- Description -->

        <p class="hero-description">

            Discover Kolkata's best pandals,
            navigate with ease and experience
            Durga Puja like never before.

        </p>



        <!-- Buttons -->

        <div class="actions">


            <a
                href="{% url 'login' %}"
                class="action login"
            >

                <i
                    class="fa-solid fa-arrow-right-to-bracket"
                ></i>

                Login

            </a>


            <a
                href="{% url 'register' %}"
                class="action register"
            >

                <i
                    class="fa-solid fa-user-plus"
                ></i>

                Create Account

            </a>

        </div>



        <!-- Features -->

        <div class="features">


            <div class="feature">

                <i class="fa-solid fa-location-dot"></i>

                Nearby Pandals

            </div>


            <div class="feature">

                <i class="fa-solid fa-route"></i>

                Smart Navigation

            </div>


            <div class="feature">

                <i class="fa-solid fa-robot"></i>

                Pandel AI

            </div>


        </div>


    </div>



    <!-- Bottom indicator -->

    <div class="scroll-indicator">

        EXPLORE

        <span class="scroll-line"></span>

    </div>


</main>



</body>

</html>
