<!DOCTYPE html>
<html>
<head>
<title>PANDEL GO | Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* =========================================================
   PANDEL GO — PREMIUM MAP UI
   UI ONLY
========================================================= */

:root{

    --bg:#070b11;
    --surface:#0c121a;
    --surface2:#111923;

    --cyan:#00e5ff;
    --blue:#367cff;

    --green:#00e89a;
    --yellow:#ffd45c;
    --red:#ff5266;

    --text:#f5f8fc;
    --muted:#8995a6;

    --border:rgba(255,255,255,.08);

}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    font-family:"Inter",Arial,sans-serif;

    background:var(--bg);
    color:white;

}


/* =========================================================
   MAP
========================================================= */

#map{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:1;

}


/* Slight dark cinematic overlay */

#map::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

}


/* =========================================================
   TOP NAV
========================================================= */

.topbar{

    position:fixed;

    top:14px;
    left:14px;
    right:14px;

    height:58px;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 10px 0 12px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:18px;

    background:
        rgba(7,11,17,.82);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.32);

    animation:
        topbarIn .5s ease;

}


@keyframes topbarIn{

    from{
        opacity:0;
        transform:translateY(-15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================================================
   AVATAR
========================================================= */

.user-avatar{

    width:38px;
    height:38px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--blue)
        );

    color:#001017;

    font-size:15px;

    font-weight:800;

    text-transform:uppercase;

    box-shadow:
        0 0 22px
        rgba(0,229,255,.3);

}


/* =========================================================
   TITLE
========================================================= */

.title{

    position:absolute;

    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:12px;

    font-weight:700;

    letter-spacing:1.2px;

    white-space:nowrap;

}


.title::first-letter{
    color:var(--cyan);
}


/* =========================================================
   ACTIONS
========================================================= */

.top-actions{

    display:flex;

    align-items:center;

    gap:7px;

}


.back-btn,
.logout-btn{

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:34px;

    padding:0 12px;

    border-radius:10px;

    text-decoration:none;

    font-size:10px;

    font-weight:700;

    transition:.2s ease;

}


.back-btn{

    color:#c5cfda;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

}


.back-btn:hover{

    color:white;

    background:
        rgba(0,229,255,.08);

    border-color:
        rgba(0,229,255,.2);

}


.logout-btn{

    color:#ff7888;

    background:
        rgba(255,82,102,.07);

    border:
        1px solid
        rgba(255,82,102,.12);

}


.logout-btn:hover{

    color:white;

    background:
        var(--red);

    box-shadow:
        0 0 18px
        rgba(255,82,102,.25);

}


/* =========================================================
   SEARCH
========================================================= */

#searchBox{

    position:fixed !important;

    top:88px !important;

    left:50% !important;

    transform:translateX(-50%) !important;

    z-index:999;

    width:min(360px,82vw) !important;

    height:42px;

    padding:
        0 17px 0 42px !important;

    border:
        1px solid
        rgba(255,255,255,.09) !important;

    border-radius:14px !important;

    outline:none !important;

    background:
        rgba(7,11,17,.84) !important;

    color:white !important;

    font-family:inherit;

    font-size:11px;

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.28);

}


#searchBox::placeholder{

    color:#758194;

}


#searchBox:focus{

    border-color:
        rgba(0,229,255,.3) !important;

    box-shadow:
        0 0 0 3px
        rgba(0,229,255,.05),
        0 15px 40px
        rgba(0,0,0,.3);

}


/* Search icon */

#searchBox::before{
    content:"";
}


/* =========================================================
   SUGGESTIONS
========================================================= */

.search-suggestion{

    background:
        rgba(10,16,24,.96);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#cbd5e1;

    transition:.15s ease;

}


/* =========================================================
   LOCATION BUTTON
========================================================= */

#locateBtn{

    position:fixed !important;

    right:18px !important;

    bottom:28px !important;

    z-index:9999;

    width:48px !important;
    height:48px !important;

    border:
        1px solid
        rgba(255,255,255,.12) !important;

    border-radius:15px !important;

    background:
        rgba(7,11,17,.88) !important;

    color:var(--cyan);

    font-size:18px !important;

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.35),
        0 0 20px
        rgba(0,229,255,.1);

    transition:.2s ease;

}


#locateBtn:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(0,229,255,.3) !important;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.4),
        0 0 25px
        rgba(0,229,255,.2);

}


/* =========================================================
   ROUTE INFO
========================================================= */

.route-info{

    position:fixed !important;

    left:50% !important;

    bottom:18px !important;

    transform:translateX(-50%) !important;

    width:min(380px,calc(100vw - 40px));

    min-height:45px;

    z-index:9999;

    padding:12px 14px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:16px;

    background:
        rgba(7,11,17,.92);

    color:white;

    font-size:11px;

    line-height:1.5;

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.4);

    animation:
        routeIn .3s ease;

}


@keyframes routeIn{

    from{
        opacity:0;
        transform:translate(-50%,10px);
    }

    to{
        opacity:1;
        transform:translate(-50%,0);
    }

}


/* =========================================================
   NAVIGATION PANEL
========================================================= */

#navPanel{

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    min-height:20px;

    color:#b9c5d2;

    font-weight:600;

}


#navPanel:hover{

    color:var(--cyan);

}


/* =========================================================
   GO BUTTON
========================================================= */

.go-btn{

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    margin:9px 0;

    padding:10px 14px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            var(--green),
            #00b987
        );

    color:#00130d;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 7px 20px
        rgba(0,232,154,.15);

    transition:.2s ease;

}


.go-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(0,232,154,.25);

}


/* =========================================================
   LEAFLET POPUPS
========================================================= */

.leaflet-popup-content-wrapper{

    padding:0 !important;

    border-radius:16px !important;

    background:
        rgba(10,16,24,.97) !important;

    color:white !important;

    border:
        1px solid
        rgba(255,255,255,.09);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.45) !important;

    backdrop-filter:
        blur(15px);

}


.leaflet-popup-tip{

    background:
        rgba(10,16,24,.97) !important;

}


.leaflet-popup-content{

    margin:14px !important;

    max-height:430px;

    overflow-y:auto;

    font-family:
        "Inter",
        Arial,
        sans-serif;

    font-size:11px;

    line-height:1.6;

}


.leaflet-popup-content::-webkit-scrollbar{

    width:4px;

}


.leaflet-popup-content::-webkit-scrollbar-thumb{

    background:
        rgba(0,229,255,.3);

    border-radius:10px;

}


.leaflet-popup-close-button{

    color:#8995a6 !important;

    font-size:18px !important;

    padding:
        7px 9px !important;

}


.leaflet-popup-close-button:hover{

    color:white !important;

}


/* =========================================================
   LEAFLET ZOOM
========================================================= */

.leaflet-control-zoom{

    border:none !important;

    margin:
        90px 14px 0 0 !important;

}


.leaflet-control-zoom a{

    width:34px !important;

    height:34px !important;

    line-height:34px !important;

    background:
        rgba(7,11,17,.86) !important;

    color:#b9c5d2 !important;

    border:
        1px solid
        rgba(255,255,255,.08) !important;

    backdrop-filter:
        blur(12px);

}


.leaflet-control-zoom a:hover{

    color:var(--cyan) !important;

    background:
        rgba(0,229,255,.08) !important;

}


/* =========================================================
   ROUTE LINE
========================================================= */

.leaflet-routing-container{

    display:none !important;

}


.leaflet-routing-line path{

    stroke:
        transparent !important;

}


/* =========================================================
   TURN BOX
========================================================= */

.turn-box{

    display:flex;

    align-items:center;

    gap:8px;

    padding:2px;

    color:white;

    font-size:11px;

}


.turn-arrow{

    width:30px;

    height:30px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:9px;

    background:
        rgba(0,229,255,.08);

    color:
        var(--cyan);

    font-size:17px;

}


/* =========================================================
   TOAST
========================================================= */

#toast{

    position:fixed !important;

    left:50% !important;

    bottom:82px !important;

    transform:
        translateX(-50%);

    z-index:10000;

    width:max-content;

    max-width:calc(100vw - 30px);

    padding:
        10px 17px !important;

    border:
        1px solid
        rgba(0,232,154,.18);

    border-radius:12px !important;

    background:
        rgba(7,11,17,.94) !important;

    color:
        #d9fff1 !important;

    font-size:10px;

    font-weight:700;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(14px);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .topbar{

        top:8px;

        left:8px;

        right:8px;

        height:52px;

        border-radius:15px;

        padding:
            0 8px;

    }


    .user-avatar{

        width:32px;
        height:32px;

        border-radius:10px;

        font-size:13px;

    }


    .title{

        display:none;

    }


    .top-actions{

        margin-left:auto;

    }


    .back-btn,
    .logout-btn{

        min-height:31px;

        padding:
            0 10px;

        font-size:9px;

        border-radius:9px;

    }


    #searchBox{

        top:70px !important;

        height:40px;

        width:
            calc(100vw - 36px) !important;

    }


    .leaflet-control-zoom{

        margin:
            125px 8px 0 0 !important;

    }


    .leaflet-control-zoom a{

        width:31px !important;

        height:31px !important;

        line-height:31px !important;

    }


    .route-info{

        bottom:13px !important;

        width:
            calc(100vw - 30px);

        max-width:none;

        border-radius:14px;

        padding:10px 12px;

        font-size:10px;

    }


    #locateBtn{

        right:14px !important;

        bottom:78px !important;

        width:43px !important;

        height:43px !important;

        border-radius:13px !important;

        font-size:16px !important;

    }


    #toast{

        bottom:132px !important;

    }


    .leaflet-popup-content{

        max-width:245px !important;

        max-height:420px;

        margin:12px !important;

        font-size:10px;

    }


    .go-btn{

        padding:9px 12px;

        font-size:10px;

    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .back-btn{

        font-size:0;

        width:32px;

        padding:0;

    }


    .back-btn::before{

        content:"←";

        font-size:15px;

    }


    .logout-btn{

        font-size:8px;

        padding:
            0 8px;

    }


    #searchBox{

        width:
            calc(100vw - 28px) !important;

    }

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes fadeInUp{

    from{

        opacity:0;

        transform:
            translateY(10px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


.leaflet-popup-content-wrapper{

    animation:
        popupIn .22s ease;

}


@keyframes popupIn{

    from{

        opacity:0;

        transform:
            translateY(8px)
            scale(.97);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

button,
a{

    -webkit-tap-highlight-color:
        transparent;

}


@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none !important;

        transition:none !important;

    }

}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="user-avatar">
        {{ request.user.username|slice:":1" }}
    </div>

    <div class="title">
        🗺 PANDEL GO MAP DASHBOARD
    </div>

    <div class="top-actions">
        <a href="{% url 'dashboard' %}" class="back-btn">⬅ Dashboard</a>
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </div>
</div>
<!-- Search Box -->
<input type="text" id="searchBox" placeholder="Search Pandal..."
style="
position:absolute;
top:75px;
left:50%;
transform:translateX(-50%);
padding:8px 15px;
border-radius:20px;
border:none;
outline:none;
width:260px;
z-index:999;
box-shadow:0 0 10px rgba(0,0,0,.4);
">

<!-- Toast -->
<div id="toast" style="
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#00ff99;
color:black;
padding:12px 24px;
border-radius:30px;
font-weight:600;
display:none;
z-index:9999;
box-shadow:0 0 15px rgba(0,255,150,.6);
">
</div>


<!-- MAP -->
<div id="map"></div>

<!-- Follow Button -->
<button id="locateBtn" style="
position:fixed;
bottom:80px;
right:20px;
z-index:9999;
background:#00f5ff;
border:none;
border-radius:50%;
width:48px;
height:48px;
font-size:22px;
cursor:pointer;
box-shadow:0 0 12px rgba(0,255,255,.7);
">
📍
</button>




<script>
    let currentCrowd = "low";

var map = L.map('map').setView([22.5726, 88.3639], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
}).addTo(map);

let markers = [];
let userLat=null, userLon=null;
let routeControl=null;
let userMarker=null; // user marker
let travelMode = "bike"; // default bike
let followUser = false; // default false
let watchId = null;
let currentRouteCoords = [];
let segmentTraffic = [];
let navMode = "walk";
let destLat = null;
let destLon = null;
let activeSegmentIndex = 0;
let currentInstructionIndex = 0;
let routeInstructions = [];
const chatParams = new URLSearchParams(window.location.search);
const chatDest = chatParams.get("chat_dest");


//// ===== CHAT DESTINATION =====
if(chatDest){
    fetch("/api/pandals/")
      .then(res => res.json())
      .then(data => {

        let cleanDest = chatDest
            .toLowerCase()
            .replace(/jabo|jete|jabo|chai|pandel|pandale|jetechai/g,"")
            .replace(/[^a-z]/g,"")
            .trim();

        if(cleanDest){

            let found = data.find(p => {
                let name = p.name
                    .toLowerCase()
                    .replace(/[^a-z]/g,"")
                    .trim();

                return name.includes(cleanDest) || cleanDest.includes(name);
            });

            if(found){
                destLat = found.latitude;
                destLon = found.longitude;
                goToPandal(destLat, destLon);
            }else{
                console.log("Pandal not found:", cleanDest);
            }
        }

      });
}



// Destination
const params = new URLSearchParams(window.location.search);
destLat = parseFloat(params.get("dest_lat"));
destLon = parseFloat(params.get("dest_lng"));
let routeDrawn = false;


// ===== Info badge =====
var infoBox = L.control({position:'bottomleft'});
infoBox.onAdd=function(){
    let div=L.DomUtil.create('div','route-info');
    div.innerHTML=`
      <div id="navPanel" onclick="openModeSelect()">
        🧭 Start navigation
      </div>
    `;
    return div;
}
infoBox.addTo(map);

/// ================= LIVE USER LOCATION =================
if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;

        var userIcon = L.divIcon({
            html:"📍",
            className:"user-pin",
            iconSize:[30,30],
            iconAnchor:[15,30]
        });

        if(userMarker){
            userMarker.setLatLng([userLat,userLon]);
        }else{
            userMarker = L.marker([userLat,userLon],{icon:userIcon})
            .addTo(map)
            .bindPopup("📍 You are here");
        }

        // 🔥 FOLLOW USER MODE
        if(followUser){
            map.setView([userLat,userLon],17);
        }

       if(!isNaN(destLat) && !isNaN(destLon) && !routeDrawn){
            showRoute(destLat, destLon);
               routeDrawn = true;
        }
         if(followUser) updateNav(pos);
    });
}

// ================= PANDALS =================

function loadPandals(){

 fetch("/api/pandals/")
 .then(res=>res.json())
 .then(data=>{

    // old markers clear
    markers.forEach(o=>map.removeLayer(o.marker));
    markers = [];

    data.forEach(p=>{
       let iconColor =
         p.crowd=="low"?"green":
         p.crowd=="medium"?"orange":
         p.crowd=="high"?"red":"gray";

      let m = L.marker([p.latitude,p.longitude], {
    icon: L.divIcon({
        html:`<div style="font-size:22px;color:${iconColor};">🚩</div>`,
        className:"",
        iconSize:[30,30],
        iconAnchor:[15,30]
    })
})
.addTo(map)
.bindPopup(`
<b>${p.name}</b><br>
Area:${p.area}<br>
Theme:${p.theme}<br>
Rating:${p.rating}<br><br>

<button 
onclick="goToPandal(${p.latitude},${p.longitude})"
class="go-btn">
📍 Go
</button>



<b>👥 Crowd Votes:</b><br>
🟢 Low (${p.crowd_low || 0})<br>
🟡 Medium (${p.crowd_medium || 0})<br>
🔴 High (${p.crowd_high || 0})<br>

<b>Final Crowd:</b>
<span style="
padding:4px 10px;
border-radius:12px;
background:${
p.crowd=='low'?'#00ff99':
p.crowd=='medium'?'#ffe066':
p.crowd=='high'?'#ff6b6b':'#cccccc'
};
${p.crowd=='none'?'NO DATA':p.crowd.toUpperCase()}
font-weight:600;">
</span>
<br><br>


<b>⏰ Best Time To Visit:</b>
<span style="
background:#00ff99;
padding:4px 10px;
border-radius:12px;
font-weight:600;">
${p.best_time}
</span>
<br><br>

<b>⏰ Select Visit Time</b><br>

<select id="timeSlot${p.id}">
<option value="">-- Select Time --</option>
<option value="00-02">12 – 2 AM</option>
<option value="02-04">2 – 4 AM</option>
<option value="04-06">4 – 6 AM</option>
<option value="06-08">6 – 8 AM</option>
<option value="08-10">8 – 10 AM</option>
<option value="10-12">10 – 12 PM</option>
<option value="12-14">12 – 2 PM</option>
<option value="14-16">2 – 4 PM</option>
<option value="16-18">4 – 6 PM</option>
<option value="18-20">6 – 8 PM</option>
<option value="20-22">8 – 10 PM</option>
<option value="22-24">10 – 12 AM</option>
</select>

<b>👥 Crowd Level</b><br>

<button onclick="setCrowd(${p.id},'low',document.getElementById('timeSlot${p.id}').value); currentCrowd='low';"
style="background:#00ff99;border:none;padding:6px 12px;border-radius:12px;margin:3px;font-weight:600;">
🟢 Low

// ================= ROUTE =================
function showRoute(lat,lon){

if(!userLat){ 
   alert("Waiting for GPS..."); 
   return;
}

if(routeControl){
   map.removeControl(routeControl);
}

routeControl = L.Routing.control({
    waypoints:[
        L.latLng(userLat,userLon),
        L.latLng(lat,lon)
    ],
    show:false,
    addWaypoints:false,
    draggableWaypoints:false,
    routeWhileDragging:false,

    // 🔴 Hide default red route line
    lineOptions:{
        styles:[{
            color:"##003cff",
            opacity:0,
            weight:0
        }]
    },

    createMarker:function(){return null;}
})
.on('routesfound', function(e){
   routeInstructions = e.routes[0].instructions || [];
   currentInstructionIndex = 0;
   let coords = e.routes[0].coordinates;
   activeSegmentIndex = 0;
   currentRouteCoords = coords;
   destLat = lat;
   destLon = lon;
   buildSegments();

   // clear old segments
   if(window.segmentLines){
      window.segmentLines.forEach(l=>map.removeLayer(l));
   }
   window.segmentLines = [];

   for(let i=0;i<coords.length-1;i++){

      let crowd = getSegmentCrowd(); // fake traffic
     

      let color =
        crowd=="low" ? "#00ff99" :
        crowd=="medium" ? "#ffe066" :
                          "#ff4d4d";

      let seg = L.polyline([
   [coords[i].lat, coords[i].lng],
   [coords[i+1].lat, coords[i+1].lng]
],{
   color: color,
   weight:3,        //  thicker line
   opacity:1,       //  more solid
   lineCap:"round",
   lineJoin:"round"
}).addTo(map);


      window.segmentLines.push(seg);
   }

   let dist = e.routes[0].summary.totalDistance / 1000;

   let speed = travelMode=="walk"?5:25;
   let baseTime = (dist/speed)*60;

let crowdFactor = 1;
if(currentCrowd=="medium") crowdFactor=1.12;
if(currentCrowd=="high") crowdFactor=1.28;

   let finalTime = Math.round(baseTime*crowdFactor);

document.querySelector('.route-info').innerHTML = `
<div style="animation:fadeInUp .4s ease;">
📏 ${dist.toFixed(2)} km<br>
⏱ ${finalTime} min<br><br>

<button onclick="prepareNavigation()" 
style="
padding:8px 18px;
border-radius:20px;
border:none;
background:linear-gradient(135deg,#00ff99,#00cc88);
color:black;
font-weight:700;
cursor:pointer;
box-shadow:0 0 12px rgba(0,255,150,.6);
">
▶ Start Navigation
</button>
</div>
`;
})
.addTo(map);

}

// ================= BUILD SEGMENTS =================
function buildSegments(){
   segmentTraffic = [];

   for(let i=0;i<currentRouteCoords.length-1;i++){
      segmentTraffic.push({
         from: currentRouteCoords[i],
         to: currentRouteCoords[i+1],
         traffic:getSegmentTraffic()
      });
   }
}



// ================= DRAW SEGMENTS =================
function drawSegments(){

   window.segmentLines = [];

   segmentTraffic.forEach(s=>{

      let color = s.traffic=="high"?"red":s.traffic=="medium"?"orange":"green";

      let line = L.polyline([
         [s.from.lat,s.from.lng],
         [s.to.lat,s.to.lng]
      ],{
         color:color,
         weight:5,
         opacity:0.8
      }).addTo(map);

      window.segmentLines.push(line);
   });
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// ================= NAVIGATION CORE =================

let FORCE_SIM = false;   // true = PC test, false = real GPS
let simTimer = null;

function startNavigation(){
   activeSegmentIndex = 0;   // 🔥 FIX
   followUser = true;
   showToast("▶ Live navigation started");

   if(FORCE_SIM){
      startSimulator();
   }else{
      watchId = navigator.geolocation.watchPosition(updateNav,{
         enableHighAccuracy:true,
         maximumAge:0
      });
   }
}


function startSimulator(){

   if(!currentRouteCoords || !currentRouteCoords.length){
      console.log("No route for simulation");
      return;
   }

   let i = activeSegmentIndex || 0;

   if(simTimer) clearInterval(simTimer);

   let speed = travelMode=="walk" ? 2200 : 900;   // 🔥 walk slow, bike fast

   simTimer = setInterval(()=>{

      if(i >= currentRouteCoords.length){
         clearInterval(simTimer);
         console.log("Simulation finished");
         return;
      }

      let p = currentRouteCoords[i];

      updateNav({
         coords:{
            latitude: p.lat,
            longitude: p.lng
         }
      });

      i++;

   }, speed);
}


// ===== GPS UPDATE =====
function updateNav(pos){
   userLat = pos.coords.latitude;
   userLon = pos.coords.longitude;

   if(userMarker){
      userMarker.setLatLng([userLat,userLon]);
   }

   if(followUser){
      map.setView([userLat,userLon],17);   // 🔥 FIX
   }

   if(currentRouteCoords.length>0){
      snapToRoute();
      recalcETA();
      updateSegmentProgress();
      updateTurnInstruction();
      checkOffRoute();
   }
}

// ===== SNAP TO ROUTE =====
function snapToRoute(){

 if(!currentRouteCoords.length) return;

 let minDist = Infinity;
 let nearestIndex = activeSegmentIndex;

 for(let i=activeSegmentIndex;i<currentRouteCoords.length;i++){
   let p=currentRouteCoords[i];
   let d=map.distance([userLat,userLon],[p.lat,p.lng]);

   if(d<minDist){
     minDist=d;
     nearestIndex=i;
   }
 }

 // only move forward
 if(nearestIndex >= activeSegmentIndex){
    let p = currentRouteCoords[nearestIndex];
    userLat = p.lat;
    userLon = p.lng;
    activeSegmentIndex = nearestIndex;
    userMarker.setLatLng([userLat,userLon]);
 }
}


// ===== ETA =====
function recalcETA(){
   if(isNaN(destLat) || isNaN(destLon)) return;

   let dist = map.distance([userLat,userLon],[destLat,destLon]) / 1000;

   let speed = travelMode=="walk" ? 5 : 25;
   let base = (dist/speed)*60;

   let crowdFactor = currentCrowd=="high"?1.28:currentCrowd=="medium"?1.12:1;

   let eta = Math.max(1, Math.round(base*crowdFactor));

   document.querySelector(".route-info").innerHTML =
`📍 Navigating (${travelMode=="walk"?"🚶":"🏍"})<br>
 📏 ${dist.toFixed(2)} km<br>
 ⏱ ${eta} min<br><br>

 <button onclick="clearNavigation()"
 style="padding:4px 10px;border-radius:10px;border:none;background:#ff4d4d;color:white;">
 ❌ Stop
 </button>`;

}

// ===== OFF ROUTE =====
function checkOffRoute(){
   let minDist = Infinity;

   currentRouteCoords.forEach(p=>{
      let d = map.distance([userLat,userLon],[p.lat,p.lng]);
      if(d < minDist) minDist = d;
   });

   if(minDist > 120){
      showToast("⚠️ Off route. Recalculating...");
      showRoute(destLat,destLon);
   }
}
function clearNavigation(){

   // stop gps / simulator
   if(watchId){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
   }

   if(simTimer){
      clearInterval(simTimer);
      simTimer = null;
   }

   // reset values
   followUser = false;
   currentRouteCoords = [];
   destLat = null;
   destLon = null;

   // remove route
   if(routeControl){
      map.removeControl(routeControl);
      routeControl = null;
   }

   if(window.segmentLines){
      window.segmentLines.forEach(l=>map.removeLayer(l));
      window.segmentLines = [];
   }

   // reset info
   document.querySelector(".route-info").innerHTML = "🧭 Start navigation";

   showToast("❌ Navigation cleared");
}



function updateSegmentProgress(){

   if(!currentRouteCoords.length) return;

   let minDist = Infinity;
   let nearestIndex = 0;

   currentRouteCoords.forEach((p,i)=>{
      let d = map.distance([userLat,userLon],[p.lat,p.lng]);
      if(d < minDist){
         minDist = d;
         nearestIndex = i;
      }
   });

   activeSegmentIndex = nearestIndex;
   highlightCurrentSegment();
}
function showTurnInstruction(){

   if(!routeInstructions.length) return;

   let ins = routeInstructions[currentInstructionIndex];
   if(!ins) return;

   let dir = ins.type;

   let arrow = "⬆️";
   if(dir=="Right") arrow="➡️";
   if(dir=="Left") arrow="⬅️";
   if(dir=="SharpRight") arrow="↗️";
   if(dir=="SharpLeft") arrow="↖️";

   document.querySelector(".route-info").innerHTML =
   `${arrow} ${ins.text}<br>
    📏 ${Math.round(ins.distance)} m`;
}

// ===== TURN INSTRUCTION =====
function updateTurnInstruction(){

 if(!routeInstructions.length) return;

 let ins = routeInstructions[currentInstructionIndex];
 if(!ins || !ins.latLng) return;   // 🔥 crash fix

 let d = map.distance(
   [userLat,userLon],
   [ins.latLng.lat, ins.latLng.lng]
 );

 if(d < 25){
   currentInstructionIndex++;
 }

 renderTurnInstruction(ins);
}

function renderTurnInstruction(ins){

 if(!ins) return;

 let arrow="⬆️";
 if(ins.type=="Right") arrow="➡️";
 if(ins.type=="Left") arrow="⬅️";
 if(ins.type=="SharpRight") arrow="↗️";
 if(ins.type=="SharpLeft") arrow="↖️";

 <div class="turn-box">
   <span class="turn-arrow">${arrow}</span>
   ${ins.text}<br>
   <small>📏 ${Math.round(ins.distance)} m</small>
 </div>
 `;
}
function highlightCurrentSegment(){

   if(!segmentTraffic || !segmentTraffic.length) return;

   if(!window.segmentLines) return;

   window.segmentLines.forEach((l,i)=>{
      if(i == activeSegmentIndex){
         l.setStyle({weight:8, opacity:1});
      }else{
         l.setStyle({weight:4, opacity:0.6});
      }
   });
}


let myLocationMarker = null;
let myAccuracyCircle = null;
let hideTimer = null;

document.getElementById("locateBtn").addEventListener("click", () => {

    if (!navigator.geolocation) {
        alert("GPS not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        // 🔥 FORCE ZOOM + CENTER
        map.setView([lat, lon], 18, {
            animate: true,
            duration: 0.6
        });

        // Marker
        if (myLocationMarker) {
            myLocationMarker.setLatLng([lat, lon]);
        } else {
            myLocationMarker = L.marker([lat, lon]).addTo(map);
        }

        // Accuracy circle
        if (myAccuracyCircle) {
            myAccuracyCircle.setLatLng([lat, lon]).setRadius(acc);
        } else {
            myAccuracyCircle = L.circle([lat, lon], {
                radius: acc,
                color: "#00f5ff",
                fillColor: "#00f5ff",
                fillOpacity: 0.15
            }).addTo(map);
        }

        // clear previous timer
        if (hideTimer) clearTimeout(hideTimer);

        // 🔥 AUTO HIDE AFTER 3 SECONDS
        hideTimer = setTimeout(() => {
            if (myLocationMarker) map.removeLayer(myLocationMarker);
            if (myAccuracyCircle) map.removeLayer(myAccuracyCircle);

            myLocationMarker = null;
            myAccuracyCircle = null;
        }, 3000);

    }, err => {
        alert("Location permission denied");
    }, {
        enableHighAccuracy:true
    });

});
